<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — Akshay Sethi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#F5F5F0;--text:#111;--muted:#888;--faint:#BBBBBB;--divider:#E4E4DE;--orange:#F47A1F;--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;}
    html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    .wrap{max-width:900px;margin:0 auto;padding:0 32px 80px;}
    nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 20px;border-bottom:1px solid var(--divider);}
    .nav-name{font-family:var(--serif);font-size:16px;font-weight:500;} .nav-name span{color:var(--orange);}
    .nav-links{display:flex;gap:24px;list-style:none;}
    .nav-links a{font-size:13px;color:var(--muted);transition:color .12s;} .nav-links a:hover,.nav-links a.active{color:var(--orange);}
    .nav-right{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;}
    .page-head{padding:40px 0 32px;}
    .page-head h1{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-0.4px;margin-bottom:6px;}
    .page-head p{font-size:13px;color:var(--muted);}
    .writing-list{list-style:none;}
    .writing-item{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--divider);}
    .writing-item:first-child{border-top:1px solid var(--divider);}
    .writing-left{display:flex;align-items:baseline;gap:20px;flex:1;}
    .wdate{font-size:11px;color:var(--faint);min-width:56px;flex-shrink:0;font-variant-numeric:tabular-nums;}
    .wtitle{font-size:14px;color:var(--text);transition:color .12s;line-height:1.4;}
    .writing-item:hover .wtitle{color:var(--orange);}
    .wtag{font-size:11px;color:var(--faint);flex-shrink:0;transition:color .12s;}
    .writing-item:hover .wtag{color:var(--orange);}
  </style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="nav-name" href="/">Akshay <span>Sethi</span></a>
    <ul class="nav-links">
      <li><a href="/writing" class="active">writing</a></li>
      <li><a href="/#photos">photos</a></li>
    </ul>
    <div class="nav-right">
      <span id="clock">—</span>
      <span style="color:var(--divider);">|</span>
      <span>Gurgaon, IN</span>
      <span id="weather">—</span>
    </div>
  </nav>

  <div class="page-head">
    <h1>Writing</h1>
    <p>Thoughts that wouldn't leave me alone.</p>
  </div>

  <ul class="writing-list">
    <li class="writing-item">
      <div class="writing-left">
        <span class="wdate">24.08.26</span>
        <a class="wtitle" href="/writing/the-art-of-slowing-down">The Art of Slowing Down</a>
      </div>
      <span class="wtag">Life</span>
    </li>
  </ul>
</div>
<script>
  function tick(){const n=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));const h=n.getHours();const m=String(n.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';document.getElementById('clock').textContent=`${h%12||12}:${m} ${ap}`;}
  tick();setInterval(tick,60000);
  fetch('https://api.open-meteo.com/v1/forecast?latitude=28.4595&longitude=77.0266&current_weather=true').then(r=>r.json()).then(d=>{document.getElementById('weather').textContent=`☁ ${Math.round(d.current_weather.temperature)}°C`;}).catch(()=>{});
</script>
</body>
</html>
